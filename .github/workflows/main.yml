# This is a basic workflow to help you get started with Actions


name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Message
        run: echo "GitHub Actions Pipeline Started"

      - name: Check Python Version
        run: python --version

